# 部署平台：泰山派 RK3566，4GB 内存 + 32GB 存储，Ubuntu 22.04 ARM64。
# 当前相机：MaixCAM Lite，经设备端 UVC 推流接入。颜色协议：1=蓝色，2=红色；不识别装甲数字。
target_color: 1
camera:
  # 先运行 scripts/maixcam_lite_live.sh --check，填写该 MaixCAM Lite 的真实节点或稳定路径。
  # 有意不使用 /dev/video0，防止误开笔记本内置摄像头。
  device: /dev/v4l/by-id/REPLACE_ME_MAIXCAM_LITE
  width: 640
  height: 360
  fps: 30
  format: MJPG # 请求模式；以实际驱动协商结果为准。
# 下列路径相对于本配置文件所在目录。
detector_config: light_bars.yaml
# 需用这台 MaixCAM Lite、实际输出分辨率重新标定；文件缺失时仅检测/跟踪，不输出 PnP 数值。
rgb_calibration: maixcam_lite_rgb_calibration.yaml
armor:
  lightbar_center_distance_m: 0.135
  lightbar_length_m: 0.056
  dimensions_confirmed: true # 用户已确认这两个尺寸；换目标时需复核。
tracking:
  confirmation_frames: 3
  lost_seconds: 0.25
  association_distance_ratio: 0.7
  association_size_ratio: 2.0
